name: Levi Video Screen Build

on:
  push:
    branches:
      - build/levi-video-screen-v0.1.0
    paths:
      - 'levivideo/**'
      - '.github/workflows/levi-video-screen-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          set -euxo pipefail
          cat levivideo/chunk*.b64 > levivideo/source.b64
          base64 -d levivideo/source.b64 > levivideo/source.zip
          unzip -t levivideo/source.zip
          unzip -q levivideo/source.zip -d levivideo/unpacked
          sha256sum levivideo/source.zip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Build arm64 levipack
        shell: bash
        run: |
          set -euxo pipefail
          cd levivideo/unpacked/LeviVideoScreen-v0.1.0-source
          chmod +x scripts/package.sh
          ./scripts/package.sh

      - name: Inspect package
        shell: bash
        run: |
          set -euxo pipefail
          p="levivideo/unpacked/LeviVideoScreen-v0.1.0-source/build-arm64-v8a/levi_video_screen-0.1.0-arm64-v8a.levipack"
          test -f "$p"
          unzip -t "$p"
          unzip -l "$p"
          unzip -p "$p" levi_video_screen/manifest.json
          mkdir -p levivideo/out
          cp "$p" levivideo/out/

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: levi-video-screen-arm64
          path: levivideo/out/*.levipack
          if-no-files-found: error
